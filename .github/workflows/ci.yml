name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/veronikats/ml-prediction-service

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Train model for tests
        run: python model/train.py

      - name: Lint with flake8
        working-directory: app
        run: flake8 . --max-line-length=120

      - name: Run unit tests
        working-directory: app
        run: pytest -v tests/

  build-and-push:
    name: Build and push
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Train model for image
        run: python model/train.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    name: Deploy to app-server
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, lab5]

    steps:
      - name: Log in to GHCR for deployment
        run: |
          printf '%s' "${{ secrets.REGISTRY_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ secrets.REGISTRY_USER }}" \
              --password-stdin

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_KEY }}" > "$HOME/.ssh/lab5_deploy"
          chmod 600 "$HOME/.ssh/lab5_deploy"
          ssh-keyscan -H "${{ secrets.VM2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Pull image and restart service
        run: |
          ssh \
            -i "$HOME/.ssh/lab5_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VM2_USER }}@${{ secrets.VM2_HOST }}" <<'REMOTE'
          set -e
          cd "$HOME/ml-prediction-service"
          git pull --ff-only origin main
          docker-compose -f docker/docker-compose.yml pull
          docker-compose -f docker/docker-compose.yml down --remove-orphans || true
          docker-compose -f docker/docker-compose.yml up -d
          docker ps --filter name=ml-app
          REMOTE

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/lab5_deploy"
          docker logout ghcr.io || true
