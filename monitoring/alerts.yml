groups:
  - name: ml-service-alerts
    interval: 30s
    rules:
      - alert: MLServiceDown
        expr: up{job="ml-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML service is unavailable"
          description: "Prometheus cannot scrape ml-app for more than one minute."

      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, rate(ml_prediction_latency_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High prediction latency"
          description: "The 95th percentile prediction latency is above one second."

      - alert: DBPredictionErrors
        expr: increase(ml_db_errors_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Database write errors"
          description: "More than three database write errors occurred in five minutes."

      - alert: NoPredictionsReceived
        expr: rate(ml_predictions_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No predictions received"
          description: "The service has received no prediction requests for ten minutes."
